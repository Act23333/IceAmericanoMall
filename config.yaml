# knowledge-rag configuration for IceAmericanoMall
paths:
  documents_dir: "./project-docs"
  data_dir: "./.knowledge-rag/data"
  models_cache_dir: "./.knowledge-rag/models_cache"

# project-docs already organized by topic, treat subfolders as categories
documents:
  supported_formats:
    - ".md"
    - ".txt"
    - ".pdf"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".csv"
    - ".py"
    - ".java"
    - ".xml"
    - ".sql"
