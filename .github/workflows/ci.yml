name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: icedamericano_mall
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: ID Invariants Gate (ADR-050/051)
        run: bash Implementation/back-end/scripts/check-id-invariants.sh

      - name: Build & Compile
        run: mvn -f Implementation/back-end/pom.xml clean compile -DskipTests

      - name: Run Unit Tests
        run: mvn -f Implementation/back-end/pom.xml test

      # 根文档计数必须由脚本生成（--write 是唯一写入口）：手改数字下次 --check 必红。
      # 放 build job 而非 consistency job：这里刚跑完全量测试，surefire 报告在工作区；
      # consistency job 不跑 mvn，放那儿等于把「测试数」这条断言关掉。
      - name: Doc counts (--check)
        run: node Implementation/back-end/scripts/sync-doc-counts.mjs --check --strict-tests

      - name: Package
        run: mvn -f Implementation/back-end/pom.xml package -DskipTests

  # Stage 1b: 前端设计 token 一致性
  # 依据 project-docs/frontend/17-Frontend-Design-System.md §2.4。
  # 不需要安装依赖 —— 检查脚本只用 node 内置模块。
  # 拦住三类漂移：① 出现无人引用的 tailwind.config.*（Tailwind v4 是 CSS-first，不读 JS config）
  # ② 17 §2.4 与 apps/web/app/globals.css 的 token 缺项或值不同 ③ 源码裸写 hex（当前为警告）
  frontend-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设计 token 一致性（17 §2.4 ⇄ apps/web/app/globals.css）
        run: node Implementation/front-end/scripts/check-design-tokens.mjs

  # Stage 2: Docker 镜像构建 + 推送（仅 push main/develop）
  # Stage 1c: 契约 ⇄ 后端 ⇄ 前端 三方一致性门禁（只读脚本，仅用 node 内置模块，无需装依赖）
  # 依据 ADR-056（snake_case 线格式）、ADR-062（对外标识与寻址口径）、
  #      09-constraints 三·六（错误承载四类划分）、ADR-063（承载层解耦）。
  # 存在的理由：这些守卫此前只在开发者记得时才跑 —— B7b 曾因后端新增错误码让
  # check-error-codes 变红却无人发现。门禁不进 CI，等于没有门禁。
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 契约七节与代码端点一致性
        run: node Implementation/back-end/scripts/check-section7.mjs

      - name: 前端 API 死路径（源码剥注释后必须 0 命中）
        run: node Implementation/front-end/scripts/check-frontend-api-paths.mjs

      - name: 前端路径与契约路径互校
        run: node Implementation/front-end/scripts/crosscheck-api-paths.mjs

      - name: 前端错误码表与后端 ErrorCode
        run: node Implementation/front-end/scripts/check-error-codes.mjs

      - name: 查询参数命名（snake_case / POJO 绑定）
        run: node Implementation/front-end/scripts/check-query-param-naming.mjs

      # 端点漂移的唯一判据：codeOnly（代码里有、契约里没有）必须为 0。
      # docOnly 是契约里标计划中的端点，属登记在册的待办，不是漂移，故不拦截。
      - name: 端点漂移（codeOnly 必须为 0）
        run: |
          node Implementation/back-end/scripts/extract-endpoints.mjs > "$RUNNER_TEMP/endpoints.txt"
          if ! grep -Eq '"codeOnly"[[:space:]]*:[[:space:]]*0([^0-9]|$)' "$RUNNER_TEMP/endpoints.txt"; then
            echo "::error::端点漂移：codeOnly 不为 0（代码中存在契约未登记的端点）"
            grep -E '"(matched|codeOnly|docOnly)"' "$RUNNER_TEMP/endpoints.txt"
            exit 1
          fi
          grep -E '"(matched|codeOnly|docOnly)"' "$RUNNER_TEMP/endpoints.txt"

  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authorization,cart,gate,item,logistics,marketing,pay,search,trade,user]
    steps:
      - uses: actions/checkout@v4

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Implementation/back-end
          file: Implementation/back-end/${{ matrix.service }}-service/Dockerfile
          push: false  # TODO: push to ghcr.io after setting up registry credentials
          tags: ghcr.io/act23333/iam-${{ matrix.service }}:latest

  # Stage 3: CD 部署 + 冒烟测试（仅 push main & docker job 成功）
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Health check loop (target: gateway)"
        run: |
          for i in $(seq 1 12); do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health 2>/dev/null || echo 000)
            echo "attempt $i: gateway health = $http_code"
            [ "$http_code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
