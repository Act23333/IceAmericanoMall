server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
    openfeign:
      okhttp:
        enabled: true
      # Feign 熔断降级（R6/V5.4）：开启后 ia-api 的 fallbackFactory 真实生效
      # （降级 Bean 由 scanBasePackages 的 org.icedamericanomall.fallback 提供，ADR-009）
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      client-name: user-service
      password: redis

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

geetest:
  captcha-id: "${GEETEST_CAPTCHA_ID:}"
  key: "${GEETEST_KEY:}"

aliyun:
  sms:
    enabled: ${ALIYUN_SMS_ENABLED:false}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:冰美式商城}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
# 微信 OAuth：enabled=false（默认）走 Mock 客户端（虚拟 openid）；接入微信开放平台后置 true 并填 app-id/secret
wechat:
  oauth:
    enabled: ${WECHAT_OAUTH_ENABLED:false}
    app-id: ${WECHAT_OAUTH_APP_ID:}
    app-secret: ${WECHAT_OAUTH_APP_SECRET:}
logging:
  level:
    org.icedamericanomall: DEBUG
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true

# V5.0: MinIO 对象存储 — 头像上传
minio:
  enabled: true
  endpoint: http://192.168.10.128:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: icedmall

# Feign 熔断参数（配套 spring.cloud.openfeign.circuitbreaker.enabled=true；与 authorization-service 同口径）
# 说明：Spring Cloud 从 resilience4j 注册表读取默认配置，未配置时 TimeLimiter 默认仅 1 秒，
# 会把「设置用户角色」等写库慢调用误判为失败并走降级（降级是 fail-closed，等于业务失败），
# 因此这里显式放宽超时并给出熔断阈值。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20                       # 统计窗口（调用次数）
        minimum-number-of-calls: 10                    # 达到该调用数才开始计算失败率
        failure-rate-threshold: 50                     # 失败率阈值（%）
        wait-duration-in-open-state: 30s               # 熔断打开后保持时长
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态试探调用数
  timelimiter:
    configs:
      default:
        timeout-duration: 5s                           # 单次 Feign 调用上限（缺省 1s 过短）
