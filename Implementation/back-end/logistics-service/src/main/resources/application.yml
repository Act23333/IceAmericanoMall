server:
  port: 8087

spring:
  application:
    name: logistics-service
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: redis
      client-name: logistics-service
  rabbitmq:
    host: ${ia.rabbitmq.host:192.168.10.128}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:-admin}
    password: ${RABBITMQ_DEFAULT_PASS:-iadmin}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    org.icedamericanomall: DEBUG



# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true
