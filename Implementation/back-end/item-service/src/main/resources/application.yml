server:
  port: 8082

spring:
  application:
    name: item-service
  # 线上字段命名统一为 snake_case（ADR 决策：全平台 snake_case；契约 §1.x 一致）
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: redis
      client-name: item-service

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── 商品分享小程序码（P37，契约 §4.4.x V5.18）──
# 生成结果按 spuId 缓存于 MinIO（wxa-code/product/{id}.png），二次请求直返 URL
item:
  share:
    # 小程序码落地页（微信 getwxacodeunlimit page 参数，需真实存在于小程序发布版本）
    wxa-page: pages/product/detail/index

# 微信小程序（P37 小程序码与登录 jscode2session 同源配置；缺 appId/secret 时
# WechatMiniApiClient 抛"小程序码生成未配置"，不 NPE；样例如下，生产经环境变量注入）：
# wechat:
#   mini:
#     app-id: ${WECHAT_MINI_APP_ID:}
#     app-secret: ${WECHAT_MINI_APP_SECRET:}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true
