server:
  port: 8089

spring:
  application:
    name: ai-service
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      base-url: https://api.deepseek.com/v1
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
        base-url: https://api.deepseek.com/v1
        options:
          model: text-embedding-3-small

# LangChain4j — DeepSeek (OpenAI 兼容)
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      base-url: https://api.deepseek.com/v1
      model-name: deepseek-chat
      temperature: 0.7
      timeout: 60s

# Redis — ChatMemory 会话持久化 + @RateLimit 限流
spring:
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: ${ia.redis.password:}
      timeout: 3000ms

# AI 服务开关 — 开发环境关闭，生产环境设置 ai.enabled=true
ai:
  enabled: false

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
