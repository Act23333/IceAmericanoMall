server:
  port: 8090

spring:
  application:
    name: marketing-service
  # 线上字段命名统一为 snake_case（全平台统一；契约 §1.x 一致）
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
    openfeign:
      okhttp:
        enabled: true
      # Feign 熔断降级：开启后 OrderClient 的 fallbackFactory 真实生效（依赖 resilience4j starter）；
      # 秒杀落单（trade-service）失败/超时不再无限等待，由降级快速失败转 BizException
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: redis
      client-name: marketing-service

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

# XXL-Job 分布式调度 — 开发环境关闭
xxl:
  job:
    enabled: false
    admin-addresses: http://192.168.10.128:8088/xxl-job-admin
    executor:
      appname: marketing-service
      port: 9997
      log-path: /tmp/xxl-job/marketing-service
      log-retention-days: 30

# Feign 熔断参数（配套 spring.cloud.openfeign.circuitbreaker.enabled=true）
# 说明：Spring Cloud 从 resilience4j 注册表读取默认配置，未配置时 TimeLimiter 默认仅 1 秒，
# 会把「秒杀落单」这类写库慢调用误判为失败并走降级（降级 fail-closed 等于业务失败），
# 因此这里显式放宽超时并给出熔断阈值（与 authorization-service 口径一致）。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20                        # 统计窗口（调用次数）
        minimum-number-of-calls: 10                    # 达到该调用数才开始计算失败率
        failure-rate-threshold: 50                     # 失败率阈值（%）
        wait-duration-in-open-state: 30s               # 熔断打开后保持时长
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态试探调用数
  timelimiter:
    configs:
      default:
        timeout-duration: 5s                           # 单次 Feign 调用上限（缺省 1s 过短）

logging:
  level:
    org.icedamericanomall: DEBUG

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true

# ── RocketMQ 5.x (V4.0: 延迟消息替代 RabbitMQ TTL) ──
rocketmq:
  enabled: true
  name-server: ${ia.rocketmq.host:192.168.10.128}:9876
  producer:
    # 秒杀订单消息发布开关（FlashSaleOrderPublisher 装配）：true=RocketMQ 实现, false/缺省=Noop 空实现
    enabled: true
    group: ${spring.application.name}-producer
