server:
  port: 8084

spring:
  application:
    name: trade-service
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      username: nacos
      password: nacoss
      discovery:
        enabled: true
    openfeign:
      okhttp:
        enabled: true
      # Sentinel 限流熔断 — 开发环境关闭
    sentinel:
      # 基础配置
      enabled: true  # 这个属性在最新版本中可能已被弃用或无效，通常不需要显式配置
      eager: true    # 取消Sentinel的懒加载，在应用启动时即初始化
      transport:
        dashboard: 192.168.10.128:8858 # 指定Sentinel控制台的地址和端口
        port: 8719                # 客户端与Dashboard通信的端口
      filter:
        enabled: true             # 启用Sentinel对Spring Web MVC的过滤器支持[reference:4]
      http-method-specify: true      # 开启 HTTP 方法区分，解决 RESTful API 问题

  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: redis
      client-name: trade-service

  rabbitmq:
    host: ${ia.rabbitmq.host:192.168.10.128}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:-admin}
    password: ${RABBITMQ_DEFAULT_PASS:-iadmin}
# ==================== Seata AT 模式 (分布式事务) ====================
# AT 模式: 一阶段自动提交 + 二阶段回滚时自动生成反向 SQL
# 适用: 下单全链路 (cart→sku→order→pay), 支付回调改订单状态
seata:
  enabled: true
  tx-service-group: icedmall_tx_group

  service:
    vgroup-mapping:
      icedmall_tx_group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      group: SEATA_GROUP
      username: nacos
      password: nacoss
      accessKey: ${NACOS_AUTH_IDENTITY_VALUE:security}
      secretKey: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
  config:
    type: file




mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto


logging:
  level:
    org.icedAmericanoMall: DEBUG
    io.seata: DEBUG

# 开启 Feign 对 Sentinel 的支持
feign:
  sentinel:
    enabled: true

# XXL-Job 分布式调度 — 开发环境关闭，生产环境设置 xxl.job.enabled=true
xxl:
  job:
    enabled: false
    admin-addresses: http://192.168.10.128:8088/xxl-job-admin
    executor:
      appname: trade-service
      port: 9999
      log-path: /tmp/xxl-job/trade-service
      log-retention-days: 30

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
