server:
  port: 8084

spring:
  application:
    name: trade-service
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root123}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

  rabbitmq:
    host: ${ia.rabbitmq.host:192.168.10.128}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:-admin}
    password: ${RABBITMQ_DEFAULT_PASS:-admin123}

# RabbitMQ 功能开关 — 开发环境关闭
rabbitmq:
  enabled: false

# Sentinel 限流熔断 — 开发环境关闭
sentinel:
  enabled: false

# XXL-Job 分布式调度 — 开发环境关闭，生产环境设置 xxl.job.enabled=true
xxl:
  job:
    enabled: false
    admin-addresses: http://192.168.10.128:8088/xxl-job-admin
    executor:
      appname: trade-service
      port: 9999
      log-path: /tmp/xxl-job/trade-service
      log-retention-days: 30
