# Dev profile: Nacos disabled, direct URLs for service routing
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:9000
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: item-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/item/**
        - id: cart-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/cart/**
        - id: trade-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/trade/**
        - id: pay-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/pay/**
        - id: logistics-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/logistics/**
        - id: admin-routes
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: INFO
