server:
  port: 9000

spring:
  application:
    name: authorization-service
  cloud:
    nacos:
      server-addr: 192.168.10.128:8848
      username: nacos
      password: nacoss
      discovery:
        enabled: true
      config:
        import-check:
          enabled: false
        #关闭 Nacos 服务端认证（仅限开发环境）
        #如果仅在本地开发，且不介意安全问题，可修改 Nacos 服务端配置文件（conf/application.properties）：
        #
        #properties
        #nacos.core.auth.enabled=false
#      config:

  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: redis
      client-name: authorization-service

jwt:
  access-token-ttl: 3600
  refresh-token-ttl: 604800
  keystore:
#    JwkSourceConfig 使用了 ClassPathResource 来加载文件，而文件路径为 classpath:keystore/keystore.p12。但需要注意的是：
    #ClassPathResource 的构造函数不需要 classpath: 前缀，它默认从类路径根目录查找。
    key-store-path: keystore/keystore.p12
    key-password: ${KEYSTORE_PASSWORD:nolazy}
    keystore-password: ${KEYSTORE_PASSWORD:nolazy}
    key-alias: jwt
  #  key-password: ${KEY_PASSWORD:changeit}     # key password (可选，如果和 storepass 相同可省略)[reference:21]


logging:
  level:
    org.springframework.security: DEBUG
    org.icedAmericanoMall: DEBUG
    org.nolazy: DEBUG

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
