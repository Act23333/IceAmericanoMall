    password: root123
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  data:
    redis:
      host: localhost
      port: 6379

# ==================== 微信支付（开发环境使用 Mock 桩代码） ====================
# 设置 merchant-id 为有效值即可激活真实微信支付
wechat:
  pay:
    merchant-id:  # 留空 = 自动使用 MockWechatPaymentClient
    # 商户下单 appid（微信 v3 下单必填；小程序 JSAPI 场景须与 openid 同源，即同 wechat.mini.app-id）
    app-id: ""
    private-key-path: ""
    merchant-serial-number: ""
    api-v3-key: ""
    notify-url: ""
    # 退款结果通知地址（F1：Mock 模式忽略；真实商户须指向网关可公网访问的
    # /api/pay/callback/wechat-refund，与支付通知 notify-url 分离）
    refund-notify-url: ""

logging:
  level:
    org.icedamericanomall: DEBUG
