server:
  port: 8085

spring:
  application:
    name: pay-service
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
    openfeign:
      okhttp:
        enabled: true
      # Feign 熔断降级：开启后 @FeignClient 的 fallbackFactory 真实生效
      # （OrderClient/BalanceClient 的降级均 fail-closed，依赖 resilience4j starter）
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: ${ia.redis.host:192.168.10.128}
      port: 6379
      password: redis
      client-name: pay-service
  rabbitmq:
    host: ${ia.rabbitmq.host:192.168.10.128}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:-admin}
    password: ${RABBITMQ_DEFAULT_PASS:-admin123}

# ==================== Seata AT 模式 (分布式事务) ====================
seata:
  enabled: true
  tx-service-group: icedmall_tx_group
  service:
    vgroup-mapping:
      icedmall_tx_group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${ia.nacos.host:192.168.10.128}:8848
      group: SEATA_GROUP
      username: nacos
      password: nacos
      accessKey: ${NACOS_AUTH_IDENTITY_VALUE:security}
      secretKey: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
  config:
    type: file

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto



# XXL-Job 分布式调度 — 开发环境关闭，生产环境设置 xxl.job.enabled=true
xxl:
  job:
    enabled: false
    admin-addresses: http://192.168.10.128:8088/xxl-job-admin
    executor:
      appname: pay-service
      port: 9998
      log-path: /tmp/xxl-job/pay-service
      log-retention-days: 30

# ==================== 微信支付配置（生产环境通过环境变量注入） ====================
wechat:
  pay:
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:/etc/wechat/apiclient_key.pem}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://your-domain.com/api/pay/callback/wechat}
    # 退款结果通知地址（与支付通知分离：两条通知打不同端点、报文字段域不同，F1 退款资金流 PAY6）
    refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:https://your-domain.com/api/pay/callback/wechat-refund}



logging:
  level:
    org.icedamericanomall: DEBUG
    io.seata: DEBUG
# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true

# Feign 熔断参数（配套 spring.cloud.openfeign.circuitbreaker.enabled=true）
# 说明：Spring Cloud 从 resilience4j 注册表读取默认配置；不配置时 TimeLimiter 默认仅 1 秒，
# 会把「支付成功回写订单状态」等慢调用误判为失败并走 fail-closed 降级（等于业务失败），
# 因此与 authorization-service 保持一致，显式放宽超时并给出熔断阈值。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20                        # 统计窗口（调用次数）
        minimum-number-of-calls: 10                    # 达到该调用数才开始计算失败率
        failure-rate-threshold: 50                     # 失败率阈值（%）
        wait-duration-in-open-state: 30s               # 熔断打开后保持时长
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态试探调用数
  timelimiter:
    configs:
      default:
        timeout-duration: 5s                           # 单次 Feign 调用上限（缺省 1s 过短）
