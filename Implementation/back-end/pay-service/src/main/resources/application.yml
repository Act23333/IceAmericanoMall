server:
  port: 8085

spring:
  application:
    name: pay-service
  datasource:
    url: jdbc:mysql://${ia.db.host:localhost}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root123}
  cloud:
    nacos:
      server-addr: ${ia.nacos.host:localhost}:8848
  data:
    redis:
      host: ${ia.redis.host:localhost}
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# ==================== 微信支付配置（生产环境通过环境变量注入） ====================
wechat:
  pay:
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:/etc/wechat/apiclient_key.pem}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://your-domain.com/api/pay/callback/wechat}
