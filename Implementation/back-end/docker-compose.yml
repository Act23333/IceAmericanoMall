
# ============================================
# IceAmericanoMall 分布式容器编排
# 默认启动基础三件 (MySQL + Redis + Nacos)
# v1.1 profile: ES + RabbitMQ + XXL-Job + MinIO + Nginx
# ============================================

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-common-restart: &common-restart
  restart: unless-stopped

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ==================== 基础设施 (默认启动) ====================

  # ---------- MySQL 9.0 (主库) ----------
  mysql:
    image: mysql:9.0
    container_name: ia-mysql
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-icedamericano_mall}
      MYSQL_USER: ${MYSQL_USER:-iamall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-iamall123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/Initialize.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/migrations/V1.1__add_points.sql:/docker-entrypoint-initdb.d/02-points.sql:ro
      - ./database/migrations/V1.1__add_coupon.sql:/docker-entrypoint-initdb.d/03-coupon.sql:ro
      - ./database/migrations/V1.1__add_logistics_status.sql:/docker-entrypoint-initdb.d/04-logistics.sql:ro
      - ./database/migrations/V1.1__add_review_favorite.sql:/docker-entrypoint-initdb.d/05-review.sql:ro
      - ./database/migrations/V1.2__add_flash_sale_home.sql:/docker-entrypoint-initdb.d/06-flash-home.sql:ro
      - ./database/migrations/V1.2__add_operation_log.sql:/docker-entrypoint-initdb.d/07-oplog.sql:ro
      - ./database/migrations/V1.2__add_shop_coupon.sql:/docker-entrypoint-initdb.d/08-shop-coupon.sql:ro
      - ./database/migrations/V2.0__add_after_sale_application.sql:/docker-entrypoint-initdb.d/09-after-sale.sql:ro
      - ./database/migrations/V2.1__add_settlement.sql:/docker-entrypoint-initdb.d/10-settlement.sql:ro
      - ./database/middleware/nacos-mysql.sql:/docker-entrypoint-initdb.d/11-nacos-mysql.sql:ro
      - ./database/middleware/xxl-job-mysql.sql:/docker-entrypoint-initdb.d/12-xxl-job-mysql.sql:ro
      - ./database/middleware/seata-mysql.sql:/docker-entrypoint-initdb.d/13-seata-mysql.sql:ro
      - ./docker/mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Redis 7 (RDB + AOF 持久化) ----------
  redis:
    image: redis:7-alpine
    container_name: ia-redis
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    sysctls:
      - net.core.somaxconn=1024
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Nacos 2.4 (注册中心 + 配置中心, standalone) ----------
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: ia-nacos
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-your_base64_key_here}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # MYSQL_SERVICE_HOST: mysql
    # MYSQL_SERVICE_DB_NAME: nacos_config
    # MYSQL_SERVICE_PORT: 3306
#	 JVM_XMS: 256m
#	 JVM_XMX: 256m
    ports:
      - "${NACOS_HTTP_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==================== V1.1 中间件 (通过 --profile v1.1 启用) ====================

  # ---------- ElasticSearch 7.17 ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    container_name: ia-elasticsearch
    profiles: ["v1.1"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      xpack.security.enabled: "false"
      xpack.monitoring.collection.enabled: "true"
      bootstrap.memory_lock: "true"
      path.repo: /usr/share/elasticsearch/snapshots
    ports:
      - "${ES_HTTP_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-snapshots:/usr/share/elasticsearch/snapshots
      - ./docker/es/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------- RabbitMQ 3.13 Management ----------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ia-rabbitmq
    profiles: ["v1.1"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin123}
      # 以下两行已删除，改为配置文件
      # RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.6
      # RABBITMQ_DISK_FREE_LIMIT: 2GB
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro   # 新增挂载
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------- XXL-Job Admin 2.4.2 ----------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.2
    container_name: ia-xxl-job
    profiles: ["v1.1"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      PARAMS: >-
        --logging.level.root=DEBUG
        --logging.level.org.springframework.web=DEBUG
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-root123}
        --server.servlet.context-path=/xxl-job-admin
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-iamall_token}
        --server.address=0.0.0.0
        --server.tomcat.max-connections=200
        --server.tomcat.accept-count=100
        --server.tomcat.threads.max=50
    ports:
      - "${XXL_JOB_PORT:-8088}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------- MinIO ----------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ia-minio
    profiles: ["v1.1"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ""
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------- Sentinel Dashboard 1.8.6 (流量控制 + 熔断降级) ----------
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: ia-sentinel
    profiles: ["v1.1"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      SERVER_PORT: 8858
      SENTINEL_DASHBOARD_USERNAME: ${SENTINEL_USERNAME:-sentinel}
      SENTINEL_DASHBOARD_PASSWORD: ${SENTINEL_PASSWORD:-sentinel}
      JAVA_OPTS: -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------- Seata Server 2.1 (分布式事务 TC) ----------
  seata:
    image: seataio/seata-server:2.1.0
    container_name: ia-seata
    profiles: ["v1.1"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    environment:
      SEATA_USERNAME: ${SEATA_USERNAME:-seata}
      SEATA_PASSWORD: ${SEATA_PASSWORD:-seata}
      NACOS_HOST: nacos
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacoss
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${SEATA_CONSOLE_PORT:-7091}:7091"
      - "${SEATA_RPC_PORT:-8091}:8091"
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
      - seata-logs:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7091"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== V1.2 反向代理 (--profile v1.2) ====================

  # ---------- 前端: 用户端 (Next.js 15) ----------
  frontend-web:
    build:
      context: ../front-end
      dockerfile: apps/web/Dockerfile
    container_name: ia-frontend-web
    profiles: ["v1.2"]
    restart: unless-stopped
    logging: *common-logging
    networks:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://nginx/api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------- 前端: 平台管理后台 ----------
  frontend-admin:
    build:
      context: ../front-end
      dockerfile: apps/admin/Dockerfile
    container_name: ia-frontend-admin
    profiles: ["v1.2"]
    restart: unless-stopped
    logging: *common-logging
    networks:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://nginx/api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------- 前端: 商家后台 ----------
  frontend-seller:
    build:
      context: ../front-end
      dockerfile: apps/seller/Dockerfile
    container_name: ia-frontend-seller
    profiles: ["v1.2"]
    restart: unless-stopped
    logging: *common-logging
    networks:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://nginx/api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------- Nginx 反向代理 ----------
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ia-nginx
    profiles: ["v1.2"]
    <<: *common-restart
    logging: *common-logging
    networks:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    depends_on:
      - nacos
      - frontend-web
      - frontend-admin
      - frontend-seller
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nginx-cache:
    driver: local
  mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/mysql
  redis-data:
    driver: local
  nacos-logs:
    driver: local
  es-data:
    driver: local
  es-snapshots:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  seata-logs:
    driver: local
  nginx-logs:
    driver: local
