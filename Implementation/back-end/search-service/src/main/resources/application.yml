server:
  port: 8086

spring:
  application:
    name: search-service
  datasource:
    url: jdbc:mysql://${ia.db.host:192.168.10.128}:3306/icedamericano_mall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw:root}
  cloud:
    nacos:
      server-addr: 192.168.10.128:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true

  data:
    redis:
      port: 6379
      host: 192.168.10.128
      password: redis
      client-name: search-service
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

# ElasticSearch 连接参数的唯一来源（SearchProperties + ElasticSearchConfig）：
#   enabled=false（本地/无 ES 环境）走 DbSearchServiceImpl（@Primary 兜底，基于 MySQL LIKE）；
#   enabled=true 激活 EsSearchServiceImpl，host/port 由本段配置。
# 注意：不要在此处添加 spring.elasticsearch.uris —— 本服务自建 ElasticsearchClient/RestClient，
#       Spring Boot 的 ES 自动配置会被既有 Bean 抑制，重复配置只会造成双份连接参数漂移。
search:
  elasticsearch:
    enabled: true
    host: 192.168.10.128
    port: 9200
  # ── 知识库向量索引（knowledge_vectors）──
  # 索引归 search-service（ES 域）所有：分块 + Embedding 都在本服务完成，
  # ai-service 只提交原文、取回 chunk 文本。
  knowledge-vector:
    # 物理索引名；默认与契约名一致（KnowledgeVectorClient.INDEX_KNOWLEDGE_VECTORS）。
    # 注意：ai-service 侧 ai.rag.enabled=true 且知识库发生增删改时才会写入本索引；
    #      检索侧 Top-K 由调用方（ai-service ai.rag.top-k）在请求中指定，本值仅在缺省时兜底。
    index-name: knowledge_vectors
    default-top-k: 5
    max-chunks: 50
  # ── Embedding API（OpenAI 兼容协议）──
  # 未配置（enabled=false 或 api-key 为空）= 未启用：摄取端点返回 0 并记 WARN，不报错，
  # 行为等价于「向量链路未接入」。dev 未就绪 ES/Embedding 时保持关闭即可（全链路降级）。
  embedding:
    enabled: ${RAG_EMBEDDING_ENABLED:false}
    base-url: ${RAG_EMBEDDING_BASE_URL:}
    path: /embeddings
    # 必须与 ai-service 检索侧模型一致（ai-service EmbeddingService 默认 text-embedding-3-small）
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    api-key: ${RAG_EMBEDDING_API_KEY:}
    # dense_vector dims 的唯一来源，必须与上面模型输出维度一致
    dims: ${RAG_EMBEDDING_DIMS:1536}
    connect-timeout: 2s
    read-timeout: 5s

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true
