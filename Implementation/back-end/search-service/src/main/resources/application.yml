server:
  port: 8086

spring:
  application:
    name: search-service
  # 线上字段命名统一为 snake_case（ADR 决策：全平台 snake_case；契约 §1.x 一致）
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    nacos:
      server-addr: 192.168.10.128:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
    openfeign:
      # Feign 熔断降级（ADR-052）：ItemSearchClient 的 fallbackFactory 生效前提（fail-closed）
      circuitbreaker:
        enabled: true

  data:
    redis:
      port: 6379
      host: 192.168.10.128
      password: redis
      client-name: search-service
# ElasticSearch 连接参数的唯一来源（SearchProperties + ElasticSearchConfig）：
#   enabled=false（本地/无 ES 环境）走 ItemServiceSpuSearchGateway（item 域检索端点，ADR-052）；
#   enabled=true 激活 EsSearchServiceImpl，host/port 由本段配置。
# 注意：不要在此处添加 spring.elasticsearch.uris —— 本服务自建 ElasticsearchClient/RestClient，
#       Spring Boot 的 ES 自动配置会被既有 Bean 抑制，重复配置只会造成双份连接参数漂移。
search:
  elasticsearch:
    enabled: true
    host: 192.168.10.128
    port: 9200
  # ── 知识库向量索引（knowledge_vectors）──
  # 索引归 search-service（ES 域）所有：分块 + Embedding 都在本服务完成，
  # ai-service 只提交原文、取回 chunk 文本。
  knowledge-vector:
    # 物理索引名；默认与契约名一致（KnowledgeVectorClient.INDEX_KNOWLEDGE_VECTORS）。
    # 注意：ai-service 侧 ai.rag.enabled=true 且知识库发生增删改时才会写入本索引；
    #      检索侧 Top-K 由调用方（ai-service ai.rag.top-k）在请求中指定，本值仅在缺省时兜底。
    index-name: knowledge_vectors
    default-top-k: 5
    max-chunks: 50
  # ── Embedding API（OpenAI 兼容协议）──
  # 未配置（enabled=false 或 api-key 为空）= 未启用：摄取端点返回 0 并记 WARN，不报错，
  # 行为等价于「向量链路未接入」。dev 未就绪 ES/Embedding 时保持关闭即可（全链路降级）。
  embedding:
    enabled: ${RAG_EMBEDDING_ENABLED:false}
    base-url: ${RAG_EMBEDDING_BASE_URL:}
    path: /embeddings
    # 必须与 ai-service 检索侧模型一致（ai-service EmbeddingService 默认 text-embedding-3-small）
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    api-key: ${RAG_EMBEDDING_API_KEY:}
    # dense_vector dims 的唯一来源，必须与上面模型输出维度一致
    dims: ${RAG_EMBEDDING_DIMS:1536}
    connect-timeout: 2s
    read-timeout: 5s

# 可观测性：Actuator 健康检查 + Prometheus 指标端点（V2.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Knife4j API 文档 ──
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true

# Feign 熔断参数（配套 spring.cloud.openfeign.circuitbreaker.enabled=true，ADR-052）
# 说明：缺省 TimeLimiter 仅 1 秒会把慢调用误判失败走降级；与 pay/authorization 保持一致口径。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
