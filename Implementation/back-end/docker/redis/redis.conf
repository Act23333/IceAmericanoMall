# ========== 网络 ==========
bind 0.0.0.0
port 6379
protected-mode yes

# ========== 认证 ==========
# 生产环境通过 docker-compose command 传入: redis-server --requirepass $REDIS_PASSWORD
# 开发环境无需密码 (REDIS_PASSWORD 为空)

# ========== 持久化 (RDB + AOF 双写) ==========
# RDB: 快照备份
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF: 增量日志 (everysec = 每秒刷盘一次)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ========== 内存管理 ==========
maxmemory 512mb
maxmemory-policy allkeys-lru

# ========== 慢日志 ==========
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========== 连接 ==========
timeout 300
tcp-keepalive 300
maxclients 10000

# ========== 主从复制 (从节点启用) ==========
# replicaof <master-ip> 6379
# masterauth ${REDIS_PASSWORD}
# replica-read-only yes
