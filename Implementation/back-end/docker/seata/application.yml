# ============================================================
# Seata Server 2.5 — Spring Boot 原生配置 (纯本地模式)
# SCA 2025.0.0.0 官方适配版本
# 注册中心用 Nacos，配置读本地文件，不依赖 Nacos 配置中心
# ============================================================

spring:
  application:
    name: seata-server
  main:
    # Seata Server 2.5 不依赖嵌入式 Web 容器，控制台由 Seata 自身 Netty 提供
    web-application-type: none

logging:
  file:
    path: /root/logs/seata
  level:
    io.seata: info

seata:
  # ==================== 注册中心: Nacos (客户端通过这里发现 Seata) ====================
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: nacos:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: ${SEATA_NACOS_USER:nacos}
      password: ${SEATA_NACOS_PWD:nacos}
      accessKey: ${NACOS_AUTH_IDENTITY_VALUE:security}
      secretKey: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}

  # ==================== 配置: 本地文件 (不依赖 Nacos 配置中心) ====================
  config:
    type: file

  # ==================== 服务端传输 ====================
  transport:
    type: TCP
    server: NIO
    heartbeat: true
    serialization: seata
    compressor: none
    threadFactory:
      bossThreadPrefix: NettyBoss
      workerThreadPrefix: NettyServerNIOWorker
      serverExecutorThreadPrefix: NettyServerBizHandler
      shareBossWorker: false
      bossThreadSize: 1

  # ==================== 事务组映射 (本地定义，后续迁移到 Nacos 共享配置) ====================
  service:
    vgroupMapping:
      icedmall_tx_group: default
    enableDegrade: false
    disableGlobalTransaction: false

  # ==================== 存储: MySQL ====================
  store:
    mode: db
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      user: root
      password: root
      min-conn: 5
      max-conn: 100
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      query-limit: 100
      max-wait: 5000

  # ==================== 安全 ====================
  security:
    secretKey: ${SEATA_SECRET_KEY:seata}
    tokenValidityInMilliseconds: 1800000
