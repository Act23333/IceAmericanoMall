# ============================================================
# Seata Server 2.5 — Spring Boot 原生配置
# SCA 2025.0.0.0 官方适配版本
# 启动前确保 Nacos 中已创建 service.vgroupMapping.icedmall_tx_group = default
# ============================================================

spring:
  application:
    name: seata-server
  main:
    # Seata Server 2.5 不依赖嵌入式 Web 容器，控制台由 Seata 自身 Netty 提供
    web-application-type: none

logging:
  file:
    path: /root/logs/seata
  level:
    io.seata: info

# ==================== 注册中心: Nacos ====================
seata:
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: nacos:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: ${SEATA_NACOS_USER:nacos}
      password: ${SEATA_NACOS_PWD:nacoss}
      # Nacos 2.4 identity 认证 — 2.5 使用 camelCase 属性名
      # accessKey 对应 NACOS_AUTH_IDENTITY_VALUE, secretKey 对应 NACOS_AUTH_IDENTITY_KEY
      accessKey: ${NACOS_AUTH_IDENTITY_VALUE:security}
      secretKey: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}

  config:
    type: nacos
    nacos:
      server-addr: nacos:8848
      group: SEATA_GROUP
      namespace: ""
      username: ${SEATA_NACOS_USER:nacos}
      password: ${SEATA_NACOS_PWD:nacoss}
      accessKey: ${NACOS_AUTH_IDENTITY_VALUE:security}
      secretKey: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}

  # ==================== 存储: MySQL ====================
  store:
    mode: db
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      user: root
      password: root
      min-conn: 5
      max-conn: 100
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      query-limit: 100
      max-wait: 5000

  # ==================== 安全 ====================
  security:
    secretKey: ${SEATA_SECRET_KEY:seata}
    tokenValidityInMilliseconds: 1800000
