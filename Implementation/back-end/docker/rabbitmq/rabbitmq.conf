# docker/rabbitmq/rabbitmq.conf (V2.5: TLS 配置。自签测试证书，启用需 rabbitmq.tls.enabled=true)
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# TLS (仅当 rabbitmq.tls.enabled=true 时 ssl_options 才生效)
# ssl_options.cacertfile = /etc/rabbitmq/certs/cacert.pem
# ssl_options.certfile   = /etc/rabbitmq/certs/cert.pem
# ssl_options.keyfile    = /etc/rabbitmq/certs/key.pem
# ssl_options.verify     = verify_peer
# ssl_options.fail_if_no_peer_cert = false
