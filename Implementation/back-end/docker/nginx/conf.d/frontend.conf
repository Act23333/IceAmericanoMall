# ============================================================
# 上游: Next.js 前端集群
# ============================================================
upstream frontend_cluster {
    least_conn;
    server frontend-web-1:3000 weight=5 max_fails=3 fail_timeout=30s;
    server frontend-web-2:3000 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================
# 主站: 冰美商城 (icedmall.local)
# ============================================================
server {
    listen 80;
    server_name icedmall.local www.icedmall.local;

    # 限流 — 单 IP 200r/s (前端页面请求更频繁)
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=200r/s;
    limit_req zone=frontend_limit burst=100 nodelay;

    client_max_body_size 10m;

    # ── Next.js 静态资源 — 直接缓存, 不经过 Next.js ──
    location /_next/static/ {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 公共静态资源 (图片/图标/manifest) ──
    location /icons/ {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /manifest.json {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        expires 1d;
    }

    # ── API 代理 → Gateway ──
    location /api/ {
        proxy_pass http://gateway_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 内部服务 (Feign 直连, 不套 Result) ──
    location /internal/ {
        deny all;
    }

    # ── 其他所有请求 → Next.js SSR/ISR ──
    location / {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    access_log /var/log/nginx/frontend-access.log;
    error_log /var/log/nginx/frontend-error.log warn;
}

# ============================================================
# 管理后台: admin.icedmall.local
# ============================================================
server {
    listen 80;
    server_name admin.icedmall.local;

    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass http://frontend-web-admin:3001;
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://gateway_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend-web-admin:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

