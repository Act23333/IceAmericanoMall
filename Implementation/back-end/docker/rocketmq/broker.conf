# ============================================
# RocketMQ 5.3 Broker 配置 — IceAmericanoMall
# 单机开发/测试环境 (生产请启用 DLedger 多副本)
# ============================================

# 集群名
brokerClusterName = IceMallCluster

# Broker 名 (单机)
brokerName = broker-a

# Broker ID (0=Master)
brokerId = 0

# 删除过期文件时间点 (凌晨4点)
deleteWhen = 04

# 文件保留时间 (72小时)
fileReservedTime = 72

# Broker 角色 (ASYNC_MASTER)
brokerRole = ASYNC_MASTER

# 刷盘方式 (ASYNC_FLUSH)
flushDiskType = ASYNC_FLUSH

# NameServer 地址 (容器内通过服务名访问)
namesrvAddr = ia-rocketmq-namesrv:9876

# 存储路径
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
storePathConsumeQueue = /home/rocketmq/store/consumequeue

# 自动创建 Topic (开发环境)
autoCreateTopicEnable = true

# 消息最大大小 (4MB)
maxMessageSize = 4194304

# 发送消息线程池
sendMessageThreadPoolNums = 16

# 拉取消息线程池
pullMessageThreadPoolNums = 16

# 延迟消息等级 (1s/5s/10s/30s/1m/2m/3m/4m/5m/6m/7m/8m/9m/10m/20m/30m/1h/2h)
# level 16 = 30min (订单超时取消)
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
