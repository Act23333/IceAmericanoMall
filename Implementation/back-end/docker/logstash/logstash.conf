# Logstash 管道 —— 接收应用日志，grok 解析 traceId，写入 ElasticSearch（Kibana 检索）。
# 日志传输方式（二选一，需在应用侧接入）：
#   1) Filebeat 采集各服务 logs/<app>/app.log（格式见 ia-common/logback-spring.xml）转发到 beats:5044；
#   2) 应用 logback 增加 TCP JSON appender（需 logstash-logback-encoder）发送到 tcp:5000。
input {
  beats { port => 5044 }
  tcp   { port => 5000 codec => json_lines }
}

filter {
  # 解析 ia-common/logback-spring.xml 的文本格式：
  # 2026-07-12 10:00:00.123 [thread] INFO  [tid:xxxx] com.foo.Bar - message
  if [message] and ![traceId] {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:ts} \[%{DATA:thread}\] %{LOGLEVEL:level}\s+\[tid:%{DATA:traceId}\] %{DATA:logger} - %{GREEDYDATA:msg}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ia-logs-%{+YYYY.MM.dd}"
  }
}
